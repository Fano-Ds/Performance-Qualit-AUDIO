<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Performance Center - Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #cbd5e1;
            --bg-card: #f8fafc;
            --border-color: #94a3b8;
            --text-main: #0f172a;
            --text-muted: #475569;
            --primary: #0284c7;
            --danger: #dc2626;
            --warning: #d97706;
            --success: #059669;
        }

        [data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --danger: #f87171;
            --warning: #fbbf24;
            --success: #34d399;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER PROFESSIONNEL STYLE LIRIS */
        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px 28px 38px 28px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            box-shadow: 0 6px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--primary);
        }

        .header-content {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        header h1 span {
            color: #38bdf8;
        }

        .datetime-theme-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .datetime {
            color: #94a3b8;
            font-size: 13px;
            font-weight: 600;
        }

        .btn-theme-header {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
        }

        .btn-theme-header:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .header-slogan {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.08);
            padding: 2px 10px;
            border-radius: 4px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
        }

        /* CONTENEUR DU TABLEAU DE BORD INTÉGRÉ */
        .dashboard-container {
            flex-grow: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            min-height: 75vh;
        }

        .dashboard-header-bar {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .dashboard-header-bar a {
            color: var(--primary);
            text-decoration: none;
        }

        .dashboard-header-bar a:hover {
            text-decoration: underline;
        }

        iframe {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            border: none;
            background-color: #ffffff;
            min-height: 75vh;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-content">
            <h1>QUALITY PERFORMANCE CENTER <span>— AUDIO</span></h1>
            <div class="datetime-theme-group">
                <div class="datetime" id="current-datetime">Chargement...</div>
                <button class="btn-theme-header" id="btn-theme" onclick="toggleTheme()">
                    🌙 <span id="theme-text">Mode Sombre</span>
                </button>
            </div>
        </div>
        <div class="header-slogan">« Mesurer la qualité. Comprendre les écarts. Piloter la performance. »</div>
    </header>

    <!-- SECTION PRINCIPALE INTÉGRÉE -->
    <div class="dashboard-container">
        <div class="dashboard-header-bar">
            <span>📊 Source active : Onglet « Qualité » (PPQ 2026)</span>
            <a href="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468#gid=1183773468" target="_blank">
                Ouvrir dans Google Sheets ↗
            </a>
        </div>
        
        <!-- Intégration iframe ciblée précisément sur l'onglet Qualité -->
        <iframe src="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    </div>

    <script>
        document.getElementById('current-datetime').innerText = new Date().toLocaleDateString('fr-FR') + ' — ' + new Date().toLocaleTimeString('fr-FR', {hour: '2-digit', minute:'2-digit'});

        function toggleTheme() {
            const html = document.documentElement;
            const themeText = document.getElementById('theme-text');
            const btnTheme = document.getElementById('btn-theme');
            
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                themeText.innerText = 'Mode Sombre';
                btnTheme.innerHTML = '🌙 Mode Sombre';
            } else {
                html.setAttribute('data-theme', 'dark');
                themeText.innerText = 'Mode Clair';
                btnTheme.innerHTML = '☀️ Mode Clair';
            }
        }
    </script>
</body>
</html>
