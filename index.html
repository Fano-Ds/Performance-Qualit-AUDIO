<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Performance Center - Audio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dashboard: {
                            bg: '#0b0f19',
                            card: '#131c2e',
                            border: '#1e293b',
                            accent: '#38bdf8'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans antialiased min-h-screen flex flex-col p-4 md:p-6">

    <!-- En-tête -->
    <header class="mb-4">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-center uppercase mb-1">
            Quality Performance Center — Audio
        </h1>
        <p class="text-xs md:text-sm text-slate-400 text-center">
            Mesurer la qualité. Comprendre les écarts. Piloter la performance (Synchronisation en direct).
        </p>
    </header>

    <!-- Conteneur d'affichage intégré et synchronisé du Google Sheets (Onglet Qualité) -->
    <main class="flex-grow w-full max-w-7xl mx-auto bg-[#131c2e] border border-[#1e293b] rounded-xl shadow-2xl overflow-hidden flex flex-col">
        <div class="bg-[#1e293b]/50 px-4 py-2 flex items-center justify-between border-b border-[#1e293b]">
            <span class="text-xs font-medium text-slate-300"><i class="fa-solid fa-table text-teal-400 mr-2"></i> Base de données - Onglet Qualité</span>
            <a href="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468#gid=1183773468" target="_blank" class="text-xs text-sky-400 hover:underline">
                Ouvrir dans Google Sheets <i class="fa-solid fa-external-link-alt text-[10px] ml-1"></i>
            </a>
        </div>
        
        <!-- Intégration iframe ciblée précisément sur l'onglet "Qualité" (gid=1183773468) -->
        <div class="flex-grow w-full" style="min-height: 80vh;">
            <iframe src="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468&amp;single=true&amp;widget=true&amp;headers=false" 
                    class="w-full h-full border-0" 
                    style="min-height: 75vh;">
            </iframe>
        </div>
    </main>

    <footer class="mt-4 text-center text-xs text-slate-500">
        Mises à jour automatiques basées sur la source Google Sheets officielle.
    </footer>

</body>
</html>
