<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quality Performance Center - Audio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 20px 28px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 6px;
            background: var(--primary);
            border-radius: 6px 0 0 6px;
        }

        header h1 {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        header h1 span {
            color: #38bdf8;
        }

        .header-slogan {
            font-size: 11px;
            font-weight: 600;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(56, 189, 248, 0.08);
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .dashboard-container {
            flex-grow: 1;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            min-height: 75vh;
        }

        .dashboard-header-bar {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .dashboard-header-bar a {
            color: var(--primary);
            text-decoration: none;
        }

        .dashboard-header-bar a:hover {
            text-decoration: underline;
        }

        iframe {
            width: 100%;
            height: 100%;
            flex-grow: 1;
            border: none;
            background-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div>
            <h1>QUALITY PERFORMANCE CENTER <span>— AUDIO</span></h1>
        </div>
        <div class="header-slogan">« Mesurer la qualité. Comprendre les écarts. Piloter la performance. »</div>
    </header>

    <!-- CONTENEUR DU TABLEAU DE BORD INTÉGRÉ -->
    <div class="dashboard-container">
        <div class="dashboard-header-bar">
            <span>📊 Source active : Onglet « Qualité » (PPQ 2026)</span>
            <a href="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468#gid=1183773468" target="_blank">
                Ouvrir le Google Sheets complet ↗
            </a>
        </div>
        
        <!-- Intégration directe pointant exactement sur l'onglet Qualité -->
        <iframe src="https://docs.google.com/spreadsheets/d/1r0wisfaxztiI-Fu-9sURdIJDVSYqpA0_ewBCPxAuHVI/edit?gid=1183773468&amp;single=true&amp;widget=true&amp;headers=false"></iframe>
    </div>

</body>
</html>
